[phases.build]
# --skip-checks: Django's model checks (JSONField) open a DB connection,
# but the /data volume isn't mounted at build time. Skip them here.
cmds = ["python manage.py collectstatic --no-input --clear --skip-checks"]

# migrate + seed must run at runtime — the /data volume is only mounted then.
[start]
cmd = "python manage.py migrate --no-input && python manage.py ensure_seed && python manage.py ensure_superuser && gunicorn config.wsgi --workers 2 --bind 0.0.0.0:$PORT"
